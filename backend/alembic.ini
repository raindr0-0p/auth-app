# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the footer.
# If left as None, the timezone of the rendering process is used.
# timezone =

# max length of characters to apply to the
# "rev" field after splitting off any dot.
# defaults to 12
#rev_id =

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
#sourceless = false

# version path separator
# As mentioned above, the default value here splits
# the resulting revid= into revisions/revision_12345abcde.py
# version_path_source = alembic:version_path
# We won't use version_path_feature in this very simple example,
# version_path_separator = ':'

# The output encoding used when revision files
# are written from script.py
#output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s